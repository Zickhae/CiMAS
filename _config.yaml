# site properties and page defaults
title: CiMAS
subtitle: Control Group for Intelligent Multi-agent Systems
description: Guidance, navigation, and control for resilient autonomy in multi-agent systems
header: images/mas.jpg
footer: images/mas.jpg
proofer: false

# site social media and other links
links:
  email: donghae.kim@dgist.ac.kr
  orcid: 0009-0000-8440-5408
  google-scholar: qDxUa2kAAAAJ


### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
